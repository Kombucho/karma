# Manual extra pass of the layered coin warmer (Actions → warm → Run workflow). The schedule is Vercel's
# own daily cron (vercel.json), kept daily to stay inside the free tier; this only adds a run on demand.
name: warm

on:
  workflow_dispatch:

concurrency:
  group: warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run the warm cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://karmawtf.vercel.app/api/cron/warm
